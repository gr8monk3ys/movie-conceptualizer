version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        patterns:
          - "*"
    ignore:
      # Pinned to the ruff-pre-commit hook rev; bump both together by hand.
      - dependency-name: "ruff"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
