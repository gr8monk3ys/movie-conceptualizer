name: security-baseline

on:
  pull_request:
  push:
    branches:
      - main

permissions: read-all

concurrency:
  group: security-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Baseline CI check
        run: |
          echo "Security baseline workflow is active"
