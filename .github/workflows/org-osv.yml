name: osv

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 1 * *"  # monthly (minute-safe policy)

permissions: read-all

concurrency:
  group: org-osv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv:
    # The previous org caller referenced google/osv-scanner-action/scan-repo,
    # which has no action.yml at that path. Use OSV-Scanner's V2 reusable
    # workflow (called at job level) instead. SARIF upload is disabled because
    # code scanning is not enabled for this repo; the scan still fails the job
    # on discovered vulnerabilities (fail-on-vuln defaults to true).
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
    with:
      upload-sarif: false
