name: org-release-please

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions: read-all

concurrency:
  group: org-release-please-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: gr8monk3ys/github/.github/workflows/reusable-release-please.yml@4a306a94d72d10b8d7835d697521a469fc6deab1
