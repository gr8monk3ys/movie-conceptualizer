name: semgrep

on:
  workflow_dispatch:
  schedule:
    - cron: "23 8 1 * *"  # monthly (minute-safe policy)

permissions: read-all

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
      - name: Semgrep scan
        # Keep the broad "auto" ruleset, but exclude two audit rules that are
        # false positives across the whole storage layer: every query is
        # parameterized (values bound separately to execute()); the f-strings
        # only assemble placeholder syntax via _param()/_params(), never user
        # data. Single-site findings are handled inline with `# nosemgrep`.
        run: >-
          semgrep scan --config auto --error
          --exclude-rule python.lang.security.audit.formatted-sql-query.formatted-sql-query
          --exclude-rule python.sqlalchemy.security.sqlalchemy-execute-raw-query.sqlalchemy-execute-raw-query
