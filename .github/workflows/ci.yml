name: ci

on:
  pull_request:
  workflow_dispatch:

permissions: read-all

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint & type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,jobs,redis,postgresql]"
      - name: Ruff (lint)
        run: ruff check src tests scripts
      - name: Ruff (format)
        run: ruff format --check src tests scripts
      - name: Mypy (strict)
        run: mypy src

  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,jobs,redis,postgresql]"
      - name: Pytest
        run: pytest -q --cov=movie_conceptualizer --cov-report=term-missing --cov-fail-under=65

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - name: Build image
        run: docker build -t moviecon:ci .
      # The image ships the CLI and the API entrypoint; importing the app
      # catches missing runtime deps that `pip install -e` hides locally.
      - name: Smoke test the image
        run: |
          docker run --rm moviecon:ci moviecon version
          docker run --rm moviecon:ci python -c "import movie_conceptualizer.api.main"
