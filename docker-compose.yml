services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MOVIECON_RATE_LIMIT_BACKEND: redis
      MOVIECON_REDIS_URL: redis://redis:6379/0
      MOVIECON_REQUIRE_AUTH: "true"
      # Must be "arq" when running with --profile jobs, otherwise the API
      # keeps executing jobs in-process and the worker receives nothing.
      MOVIECON_JOB_BACKEND: ${MOVIECON_JOB_BACKEND:-inprocess}
      MOVIECON_JOB_REDIS_URL: ${MOVIECON_JOB_REDIS_URL:-redis://redis:6379/0}
      # Set these in a .env file or your shell; never commit secrets.
      MOVIECON_SECRET_KEY: ${MOVIECON_SECRET_KEY:?set MOVIECON_SECRET_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - moviecon-data:/home/moviecon/.movie-conceptualizer
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Background job worker (arq). Enable with: docker compose --profile jobs up
  worker:
    profiles: ["jobs"]
    build: .
    command: ["arq", "movie_conceptualizer.api.arq_tasks.WorkerSettings"]
    environment:
      MOVIECON_JOB_BACKEND: arq
      MOVIECON_JOB_REDIS_URL: redis://redis:6379/0
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - moviecon-data:/home/moviecon/.movie-conceptualizer
    depends_on:
      redis:
        condition: service_healthy

volumes:
  moviecon-data:
