[project]
name = "movie-conceptualizer"
version = "0.1.0"
description = "AI-powered filmmaking platform: script → shot list → storyboard"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-only"}
authors = [
    {name = "Movie Conceptualizer Team"}
]
keywords = ["filmmaking", "ai", "screenwriting", "storyboard", "pre-production"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.2.0",
    "pypdf>=5.0.0",
    "pydantic>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    # Authentication dependencies
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=46.0.5",
    "passlib[bcrypt]>=1.7.4",
    # Storage dependencies
    "aiosqlite>=0.19.0",
    # Rate limiting
    "slowapi>=0.1.9",
    # PDF export
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    # Pinned to match the ruff-pre-commit hook rev so CI and pre-commit agree.
    "ruff==0.9.10",
    "mypy>=1.11.0",
]
pdf = [
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.13",
    "pillow>=10.0.0",
]
redis = [
    "redis>=5.0.0",
]
jobs = [
    "arq>=0.26.0",
    "redis>=5.0.0",
]
postgresql = [
    "asyncpg>=0.29.0",
]

[project.scripts]
moviecon = "movie_conceptualizer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/movie_conceptualizer"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
# Line length for code is enforced by `ruff format` (gated via `ruff format
# --check` in CI). E501 is disabled here because the linter would otherwise
# flag un-splittable string literals (LLM prompts, SQL, SVG fragments) that
# the formatter intentionally leaves intact.
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
# `@computed_field` stacked on `@property` is the documented Pydantic v2
# pattern but trips mypy's `prop-decorator` check; it is not a real error.
disable_error_code = ["prop-decorator"]

# Optional / third-party dependencies that ship without type stubs.
[[tool.mypy.overrides]]
module = [
    "pdf2image",
    "pytesseract",
    "asyncpg",
    "asyncpg.*",
    "jose",
    "jose.*",
    "passlib",
    "passlib.*",
    "reportlab",
    "reportlab.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
